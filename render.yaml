services:
  - type: web
    name: video-to-text-converter
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install Flask==2.3.2 flask-cors==4.0.0 yt-dlp==2023.10.13 openai-whisper==20231117
    startCommand: python app.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12